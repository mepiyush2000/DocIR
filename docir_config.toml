# DocIR runtime configuration.
# Edit and save -- picked up on the next run (no restart/reinstall needed).

[logging]
# Turn on verbose debug logging (e.g. which standard page ratio a canvas
# snapped to, or that its ratio was too distinctive to snap).
debug = false

[preprocess]
# "auto": fix orientation, unwarp curved pages, deskew tilted ones -- only
# when detected. "off": use the image as-is. "force": always unwarp.
mode = "auto"

[lines]
# Run line-level OCR (PP-OCRv5) for exact per-line geometry; results are
# cached next to the layout JSON as <name>_lines.json.
enabled = true

[render]
# "lines": draw every text line at its measured position (most faithful).
# "paragraph": reflow each block's text inside its box.
mode = "lines"
# Blocks whose lines tilt by at most this many degrees (scan / camera
# error) are drawn perfectly level; larger angles are kept. 0 = keep all tilts.
straighten_max_deg = 5.0
# Added to every measured font size, in PDF points (the page is 612 pt
# wide). Negative = slightly smaller text than measured. 0 = as measured.
font_size_offset_pt = 0.0
# Added to every measured font size, in percent of that size (applied with
# the point offset above). -10 = text 10% smaller than measured.
font_size_offset_pct = -10.0
